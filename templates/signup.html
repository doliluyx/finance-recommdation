
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoriFit 회원가입</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f8f8;font-family:Arial,'Malgun Gothic',sans-serif;color:#18313a}
header{height:75px;background:white;padding:0 8%;display:flex;align-items:center}
.logo{width:125px}
.container{padding:35px 15px}
.signup-box{width:550px;max-width:100%;margin:auto;background:white;border-radius:20px;padding:38px 45px;box-shadow:0 8px 35px #0000000d}
h1{margin:0 0 8px;font-size:26px}
.desc{color:#829097;font-size:14px;margin-bottom:25px}
label{display:block;font-size:13px;font-weight:bold;margin:15px 0 7px}
input,select{width:100%;height:44px;padding:0 12px;border:1px solid #dce4e6;border-radius:8px;background:white;outline:none}
input:focus,select:focus{border-color:#009b83}
.profile{display:flex;align-items:center;gap:15px;margin-bottom:15px}
.preview{width:75px;height:75px;border-radius:50%;object-fit:cover;background:#edf3f3}
.profile input{border:0;padding:8px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{width:100%;height:49px;background:#009b83;color:white;border:0;border-radius:9px;font-size:15px;font-weight:bold;margin-top:28px;cursor:pointer}
.error{background:#fff0ef;color:#d9534f;padding:10px;border-radius:8px;font-size:13px;margin-bottom:15px}
.back{text-align:center;margin-top:20px;font-size:13px}
a{color:#009b83;text-decoration:none}
@media(max-width:500px){.signup-box{padding:30px 22px}.row{grid-template-columns:1fr;gap:0}}
</style>
</head>
<body>
<header>
    <a href="/"><img src="/static/logo.png" class="logo" alt="로고"></a>
</header>

<div class="container">
<div class="signup-box">
    <h1>회원가입</h1>
    <div class="desc">나에게 맞는 금융상품 추천을 위해 정보를 입력해주세요.</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form action="/signup" method="post" enctype="multipart/form-data">

        <label>프로필 사진</label>
        <div class="profile">
            <img id="preview" class="preview" src="/static/logo.png" alt="프로필 미리보기">
            <input type="file" name="profile" accept="image/png,image/jpeg,image/webp" onchange="previewImage(event)">
        </div>

        <div class="row">
            <div>
                <label>아이디</label>
                <input type="text" name="userid" placeholder="아이디" required>
            </div>
            <div>
                <label>비밀번호</label>
                <input type="password" name="password" placeholder="6자 이상" minlength="6" required>
            </div>
        </div>

        <div class="row">
            <div>
                <label>이름</label>
                <input type="text" name="name" placeholder="이름" required>
            </div>
            <div>
                <label>나이</label>
                <input type="number" name="age" min="18" max="100" placeholder="만 나이" required>
            </div>
        </div>

        <label>이메일</label>
        <input type="email" name="email" placeholder="example@email.com" required>

        <div class="row">
            <div>
                <label>성별</label>
                <select name="gender" required>
                    <option value="">선택해주세요</option>
                    <option value="여성">여성</option>
                    <option value="남성">남성</option>
                    <option value="기타">기타</option>
                </select>
            </div>
            <div>
                <label>투자성향</label>
                <select name="risk" required>
                    <option value="">선택해주세요</option>
                    <option value="안정형">안정형</option>
                    <option value="안정추구형">안정추구형</option>
                    <option value="위험중립형">위험중립형</option>
                    <option value="적극투자형">적극투자형</option>
                    <option value="공격투자형">공격투자형</option>
                </select>
            </div>
        </div>

        <label>직업</label>
        <select name="job" required>
            <option value="">직업을 선택해주세요</option>
            <option value="학생">학생</option>
            <option value="직장인">직장인</option>
            <option value="공무원">공무원</option>
            <option value="자영업">자영업</option>
            <option value="프리랜서">프리랜서</option>
            <option value="주부">주부</option>
            <option value="무직">무직</option>
            <option value="기타">기타</option>
        </select>

        <label>연소득</label>
        <select name="income" required>
            <option value="">소득을 선택해주세요</option>
            <option value="2,000만원 미만">2,000만원 미만</option>
            <option value="2,000만원~3,000만원">2,000만원~3,000만원</option>
            <option value="3,000만원~5,000만원">3,000만원~5,000만원</option>
            <option value="5,000만원~7,000만원">5,000만원~7,000만원</option>
            <option value="7,000만원 이상">7,000만원 이상</option>
        </select>

        <button type="submit">회원가입 완료</button>
    </form>

    <div class="back">이미 계정이 있으신가요? <a href="/">로그인하기</a></div>
</div>
</div>

<script>
function previewImage(event){
    const file=event.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=function(e){
        document.getElementById("preview").src=e.target.result;
    };
    reader.readAsDataURL(file);
}
</script>
</body>
</html>
